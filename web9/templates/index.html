<!DOCTYPE html>
<html>
<head>
    <title>Speech App</title>
</head>

<body>

<h2>Speech to Text & Text to Speech</h2>

<!-- Speech to Text -->
<button onclick="startSpeech()">Speak</button>
<p id="output">Your speech will appear here</p>

<hr>

<!-- Text Input -->
<input type="text" id="textInput" placeholder="Enter text">

<!-- Text to Speech -->
<button onclick="speakText()">Speak Text</button>

<script>

// Speech to Text (async)
async function startSpeech() {
    try {
        let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.start();

        recognition.onresult = function(e) {
            let text = e.results[0][0].transcript;
            document.getElementById("output").innerText = text;
            document.getElementById("textInput").value = text;
        };

    } catch (error) {
        alert("Speech recognition error");
    }
}

// Text to Speech (async)
async function speakText() {
    try {
        let text = document.getElementById("textInput").value;

        if (!text) {
            alert("Enter text");
            return;
        }

        speechSynthesis.cancel();

        let speech = new SpeechSynthesisUtterance(text);
        speechSynthesis.speak(speech);

    } catch (error) {
        alert("Text to speech error");
    }
}

</script>

</body>
</html>
