<!DOCTYPE html>
<html>
<head>
    <title>Spam Classifier</title>
</head>
<body>
    <h1>Spam Message Classifier</h1>
    
    <form id="spamForm">
        <label for="message">Enter Message:</label>
        <textarea id="message" name="message" rows="5" cols="50" required></textarea>
        <br>
        <button type="submit">Check Message</button>
    </form>

    <div id="result">
        <h2>Result:</h2>
        <p id="outputMessage"></p>
        <p id="predictionResult"></p>
    </div>

    <script>
        document.getElementById('spamForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const message = document.getElementById('message').value;
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                
                document.getElementById('outputMessage').textContent = 'Message: ' + data.input_message;
                document.getElementById('predictionResult').textContent = 'Classification: ' + data.result;
            } catch (error) {
                document.getElementById('predictionResult').textContent = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
