<!DOCTYPE html>
<html>
<head>
    <title>Product Recommendations</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; }
        button { padding: 8px 12px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; background: #f0f0f0; margin: 5px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Product Recommendation System</h1>
    
    <h2>Products</h2>
    <div id="products"></div>
    
    <h2>Recommended Products</h2>
    <ul id="recommendations"></ul>

    <script>
        const products = [
            {id: 1, name: "Laptop"},
            {id: 2, name: "Phone"},
            {id: 3, name: "Headphones"},
            {id: 4, name: "Shirt"},
            {id: 5, name: "Jeans"},
            {id: 6, name: "Jacket"}
        ];

        // Display products
        const productDiv = document.getElementById("products");
        products.forEach(product => {
            const btn = document.createElement("button");
            btn.textContent = product.name;
            btn.onclick = () => recommend(product.id);
            productDiv.appendChild(btn);
        });

        // Get recommendations
        async function recommend(id) {
            try {
                const response = await fetch('/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({id: id})
                });

                const data = await response.json();
                const recList = document.getElementById("recommendations");
                recList.innerHTML = "";
                
                if (data.length === 0) {
                    recList.innerHTML = "<li>No recommendations found</li>";
                } else {
                    data.forEach(item => {
                        const li = document.createElement("li");
                        li.textContent = item.name;
                        recList.appendChild(li);
                    });
                }
            } catch (error) {
                document.getElementById("recommendations").innerHTML = "<li>Error: " + error.message + "</li>";
            }
        }
    </script>
</body>
</html>
